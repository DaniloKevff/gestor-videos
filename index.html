<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Videos Kedsac</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
    }
    h1 {
      background: linear-gradient(90deg, #ff7e5f, #feb47b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .nav-tabs .nav-link {
      color: #bbb;
    }
    .nav-tabs .nav-link.active {
      background-color: #333;
      color: #fff;
    }
    .form-control, .btn {
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
    }
    .btn {
      transition: 0.3s;
    }
    .btn:hover {
      background-color: #555;
    }
    .status-buttons .btn {
      width: 100%;
    }
    .card {
      border: 1px solid #444;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      margin-bottom: 1rem;
    }
    .card a {
      color: #0dcaf0;
      text-decoration: underline;
    }
    .card a:hover {
      color: #0bb5da;
      text-decoration: none;
    }
    .modal-content {
      border-radius: 8px;
    }
    .modal-header, .modal-footer {
      border: none;
    }
    .modal-body label {
      font-weight: bold;
    }
    .modal .btn.active {
      box-shadow: 0 0 10px rgba(13, 202, 240, 0.7);
    }
    /* Colores para diferenciar la información guardada */
    .saved-linkRef {
      color: #0dcaf0; /* Celeste */
    }
    .saved-commentRef {
      color: #28a745; /* Verde */
    }
    .saved-linkDrive {
      color: #d63384; /* Rosa/Púrpura */
    }
    .saved-commentDrive {
      color: #fd7e14; /* Naranja */
    }
    .saved-estadoRealizacion {
      color: #20c997; /* Aguamarina */
    }
    .saved-estadoAprobacion {
      color: #dc3545; /* Rojo */
    }
  </style>
</head>
<body>
  <div class="container mt-4">
    <h1>Gestor de Videos Kedsac</h1>
    <ul class="nav nav-tabs" id="jornadasTabs"></ul>
    <div class="tab-content" id="jornadasContent"></div>
  </div>

  <!-- Modal para editar video -->
  <div insert="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content bg-dark text-white">
        <div class="modal-header">
          <h5 class="modal-title" id="editModalLabel">Editar Video</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <!-- Link de Referencia y Comentarios -->
          <div class="mb-2">
            <label for="modalLinkRef">Link de Referencia:</label>
            <input type="text" class="form-control" id="modalLinkRef">
          </div>
          <div class="mb-2">
            <label for="modalCommentRef">Comentarios (Referencia):</label>
            <textarea class="form-control" id="modalCommentRef" rows="2"></textarea>
          </div>
          <!-- Botones de estado: Realizado / Por Realizar -->
          <div class="mb-2">
            <label>Estado Realización:</label>
            <div class="d-flex">
              <button class="btn btn-success me-2" id="btnRealizado" onclick="setEstadoRealizacion('realizado')">Realizado</button>
              <button class="btn btn-warning" id="btnPorRealizar" onclick="setEstadoRealizacion('por_realizar')">Por Realizar</button>
            </div>
          </div>
          <!-- Link de Google Drive y Comentarios -->
          <div class="mb-2">
            <label for="modalLinkDrive">Link de Google Drive:</label>
            <input type="text" class="form-control" id="modalLinkDrive">
          </div>
          <div class="mb-2">
            <label for="modalCommentDrive">Comentarios (Google Drive):</label>
            <textarea class="form-control" id="modalCommentDrive" rows="2"></textarea>
          </div>
          <!-- Botones de estado: Aprobado / En Revisión -->
          <div class="mb-2">
            <label>Estado Aprobación:</label>
            <div class="d-flex">
              <button class="btn btn-primary me-2" id="btnAprobado" onclick="setEstadoAprobacion('aprobado')">Aprobado</button>
              <button class="btn btn-danger" id="btnEnRevision" onclick="setEstadoAprobacion('en_revision')">En Revisión</button>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-info" onclick="saveModalData()">Guardar</button>
        </div>
      </div>
    </div>
  </div>
  <!-- Fin Modal -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let currentVideoId = "";
    let estadoRealizacion = "";
    let estadoAprobacion = "";

    $(document).ready(function() {
      let jornadas = 4;
      let videosPorJornada = 6;
      let jornadasTabs = $('#jornadasTabs');
      let jornadasContent = $('#jornadasContent');

      for (let i = 1; i <= jornadas; i++) {
        let jornadaId = `jornada${i}`;
        jornadasTabs.append(`<li class="nav-item">
          <a class="nav-link ${i === 1 ? 'active' : ''}" data-bs-toggle="tab" href="#${jornadaId}">Jornada ${i}</a>
        </li>`);
        let jornadaContent = `<div class="tab-pane fade ${i === 1 ? 'show active' : ''}" id="${jornadaId}">
          <ul class="nav nav-pills mt-3" id="videosTabs${i}"></ul>
          <div class="tab-content" id="videosContent${i}"></div>
        </div>`;
        jornadasContent.append(jornadaContent);
        let videosTabs = $(`#videosTabs${i}`);
        let videosContent = $(`#videosContent${i}`);
        for (let j = 1; j <= videosPorJornada; j++) {
          let videoId = `${jornadaId}-video${j}`;
          videosTabs.append(`<li class="nav-item">
            <a class="nav-link ${j === 1 ? 'active' : ''}" data-bs-toggle="pill" href="#${videoId}">Video ${j}</a>
          </li>`);
          videosContent.append(`
            <div class="tab-pane fade ${j === 1 ? 'show active' : ''}" id="${videoId}">
              <div class="card bg-dark text-white p-3">
                <h5>Video ${j} - Jornada ${i}</h5>
                <p><strong>Link de Referencia:</strong> <span id="${videoId}-linkRef-display" class="saved-linkRef"></span></p>
                <p><strong>Comentarios (Referencia):</strong> <span id="${videoId}-commentRef-display" class="saved-commentRef"></span></p>
                <p><strong>Link de Google Drive:</strong> <span id="${videoId}-linkDrive-display" class="saved-linkDrive"></span></p>
                <p><strong>Comentarios (Google Drive):</strong> <span id="${videoId}-commentDrive-display" class="saved-commentDrive"></span></p>
                <p><strong>Estado Realización:</strong> <span id="${videoId}-estadoRealizacion-display" class="saved-estadoRealizacion"></span></p>
                <p><strong>Estado Aprobación:</strong> <span id="${videoId}-estadoAprobacion-display" class="saved-estadoAprobacion"></span></p>
                <button class="btn btn-info" onclick="openEditModal('${videoId}')">Editar</button>
              </div>
            </div>
          `);
        }
      }
    });

    // Abre el modal y carga los datos actuales del video
    function openEditModal(videoId) {
      currentVideoId = videoId;
      $('#modalLinkRef').val($(`#${videoId}-linkRef-display a`).attr('href') || $(`#${videoId}-linkRef-display`).text());
      $('#modalCommentRef').val($(`#${videoId}-commentRef-display`).text());
      $('#modalLinkDrive').val($(`#${videoId}-linkDrive-display a`).attr('href') || $(`#${videoId}-linkDrive-display`).text());
      $('#modalCommentDrive').val($(`#${videoId}-commentDrive-display`).text());
      estadoRealizacion = $(`#${videoId}-estadoRealizacion-display`).text();
      estadoAprobacion = $(`#${videoId}-estadoAprobacion-display`).text();
      resetEstadoButtons();
      if (estadoRealizacion === 'REALIZADO') {
        $('#btnRealizado').addClass('active');
      } else if (estadoRealizacion === 'POR REALIZAR') {
        $('#btnPorRealizar').addClass('active');
      }
      if (estadoAprobacion === 'APROBADO') {
        $('#btnAprobado').addClass('active');
      } else if (estadoAprobacion === 'EN REVISIÓN') {
        $('#btnEnRevision').addClass('active');
      }
      let modal = new bootstrap.Modal(document.getElementById('editModal'));
      modal.show();
    }

    function resetEstadoButtons() {
      $('#btnRealizado, #btnPorRealizar, #btnAprobado, #btnEnRevision').removeClass('active');
    }

    function setEstadoRealizacion(estado) {
      estadoRealizacion = estado.toUpperCase();
      $('#btnRealizado, #btnPorRealizar').removeClass('active');
      if (estado === 'realizado') {
        $('#btnRealizado').addClass('active');
      } else {
        $('#btnPorRealizar').addClass('active');
      }
    }

    function setEstadoAprobacion(estado) {
      estadoAprobacion = estado.toUpperCase();
      $('#btnAprobado, #btnEnRevision').removeClass('active');
      if (estado === 'aprobado') {
        $('#btnAprobado').addClass('active');
      } else {
        $('#btnEnRevision').addClass('active');
      }
    }

    function saveModalData() {
      let linkRef = $('#modalLinkRef').val().trim();
      let commentRef = $('#modalCommentRef').val().trim();
      let linkDrive = $('#modalLinkDrive').val().trim();
      let commentDrive = $('#modalCommentDrive').val().trim();

      // Actualiza la vista de la tarjeta convirtiendo los links en hipervínculos interactivos
      if(linkRef !== ''){
        $(`#${currentVideoId}-linkRef-display`).html(`<a href="${linkRef}" target="_blank">${linkRef}</a>`);
      } else {
        $(`#${currentVideoId}-linkRef-display`).text('');
      }
      if(linkDrive !== ''){
        $(`#${currentVideoId}-linkDrive-display`).html(`<a href="${linkDrive}" target="_blank">${linkDrive}</a>`);
      } else {
        $(`#${currentVideoId}-linkDrive-display`).text('');
      }
      $(`#${currentVideoId}-commentRef-display`).text(commentRef);
      $(`#${currentVideoId}-commentDrive-display`).text(commentDrive);
      $(`#${currentVideoId}-estadoRealizacion-display`).text(estadoRealizacion);
      $(`#${currentVideoId}-estadoAprobacion-display`).text(estadoAprobacion);

      // Envío de datos vía AJAX (reemplaza YOUR_GOOGLE_SCRIPT_ID por tu ID real)
      $.ajax({
        url: 'https://script.google.com/macros/s/AKfycbz1MCGju877kuOGey-g9NDVVoxUeAKwnjRG2kpkXmD9CyPDKh884LxiORu9AH_8YlXU/exec',
        method: 'POST',
        contentType: 'application/jsonp',
        data: JSON.stringify({
          videoId: currentVideoId,
          linkRef: linkRef,
          commentRef: commentRef,
          linkDrive: linkDrive,
          commentDrive: commentDrive,
          estadoRealizacion: estadoRealizacion,
          estadoAprobacion: estadoAprobacion
        }),
        success: function(response) {
    alert('Datos guardados correctamente.');
  },
  error: function(jqXHR, textStatus, errorThrown) {
    console.error("Error al guardar:", textStatus, errorThrown);
    alert('Error al guardar.');
  }
});

      // Cierra el modal tras guardar
      let modalEl = document.getElementById('editModal');
      let modal = bootstrap.Modal.getInstance(modalEl);
      modal.hide();
    }
  </script>
</body>
</html>
